# Release pipeline, run by .github/workflows/release.yml on a v* tag in the public repository. Locally,
# only `goreleaser release --snapshot --clean`, which publishes nothing.
# Images go to ghcr.io/$IMAGE_OWNER/gresbase; release.yml sets IMAGE_OWNER to the repository owner
# (locally: IMAGE_OWNER=OWNER goreleaser check).
version: 2

project_name: gresbase

before:
  hooks:
    - sh -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - main: ./cmd/gresbase
    binary: gresbase
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
      - TRADEMARKS.md
      - README.md
      - src: web/public/licenses/THIRD_PARTY_NOTICES.txt
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

dockers_v2:
  - images: ["ghcr.io/{{ .Env.IMAGE_OWNER }}/gresbase"]
    dockerfile: Dockerfile.release
    extra_files: [LICENSE, NOTICE, TRADEMARKS.md, web/public/licenses/THIRD_PARTY_NOTICES.txt]
    platforms: [linux/amd64, linux/arm64]
    # 0.3.0, 0.3 and latest; from 1.0 also the major tag (1). site/content/*/upgrading.md explains them.
    tags: ["{{ .Version }}", "{{ .Major }}.{{ .Minor }}", "{{ if .Major }}{{ .Major }}{{ end }}", "latest"]
    labels:
      org.opencontainers.image.title: gresbase
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.description: &description "Web manager for any PostgreSQL, as one more container next to your database. Port 8080; set DATABASE_URL or use the setup wizard."
      org.opencontainers.image.url: &url https://gresbase.pages.dev
      org.opencontainers.image.documentation: &docs https://gresbase.pages.dev/docs/quick-start/
      org.opencontainers.image.licenses: Apache-2.0
    # The GHCR package page reads the description of a multi-arch image from the index annotations.
    annotations:
      org.opencontainers.image.description: *description
      org.opencontainers.image.url: *url
      org.opencontainers.image.documentation: *docs
      org.opencontainers.image.licenses: Apache-2.0

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
  filters:
    exclude: ['^docs', '^test', '^chore', '^merge']
