version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - ineffassign
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
