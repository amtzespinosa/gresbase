<style>
/* ---------- Tokens (design.md) ---------- */
:root, .t-light {
  --bg: #F4F3F0; --surface: #FFFFFF; --surface-2: #F7F6F3; --border: #E6E3DD;
  --text: #1C1A17; --muted: #6B665E;
  --accent: #FFC929; --on-accent: #17130C; --accent-ink: #806515; --accent-tint: #FFC92933;
  --row-selected: #EBE8E2; --row-selected-edited: #ECD38C; --row-selected-muted: #57524B; --row-selected-ink: #6B5410;
  --success: #22A06B; --pill: #1C1A17; --on-pill: #F4F3F0; --label-blue: #2563EB;
  --syntax-string: #0F766E; --syntax-number: #1D4ED8; --syntax-function: #A21CAF;
  --card-shadow: 0 1px 2px rgba(28,26,23,.04), 0 8px 24px rgba(28,26,23,.05);
  --shot-shadow: 0 1px 2px rgba(28,26,23,.04), 0 28px 72px rgba(28,26,23,.12);
  --icon-shadow: 0 1px 2px rgba(28,26,23,.08), 0 14px 36px rgba(191,140,0,.30);
  --seg-shadow: 0 1px 2px rgba(28,26,23,.10);
  --logo-glow: none;
  --dot-off: #CFCAC1;
  --sil-gray: .065; --sil-yellow: .4;
  color-scheme: light;
}
[data-theme="dark"], .t-dark {
  --bg: #0B0B0A; --surface: #161615; --surface-2: #1C1C1A; --border: #2A2926;
  --text: #EDEBE6; --muted: #AEAAA1;
  --accent: #FFC929; --on-accent: #17130C; --accent-ink: #FFC929; --accent-tint: #FFC9292E;
  --row-selected: #2C2B28; --row-selected-edited: #61542E; --row-selected-muted: #D6D2C9; --row-selected-ink: #FFE08A;
  --success: #22A06B; --pill: #EDEBE6; --on-pill: #17130C; --label-blue: #60A5FA;
  --syntax-string: #6EE7C8; --syntax-number: #93C5FD; --syntax-function: #F0ABFC;
  --card-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  --shot-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 28px 72px rgba(0,0,0,.55);
  --icon-shadow: 0 0 18px #FFC92966, 0 0 56px #FFC92933;
  --seg-shadow: 0 1px 2px rgba(0,0,0,.45);
  --logo-glow: 0 0 18px #FFC92966;
  --dot-off: #3A3935;
  --sil-gray: .08; --sil-yellow: .2;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0A; --surface: #161615; --surface-2: #1C1C1A; --border: #2A2926;
    --text: #EDEBE6; --muted: #AEAAA1;
    --accent-ink: #FFC929; --accent-tint: #FFC9292E;
    --row-selected: #2C2B28; --row-selected-edited: #61542E; --row-selected-muted: #D6D2C9; --row-selected-ink: #FFE08A;
    --pill: #EDEBE6; --on-pill: #17130C; --label-blue: #60A5FA;
    --syntax-string: #6EE7C8; --syntax-number: #93C5FD; --syntax-function: #F0ABFC;
    --card-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
    --shot-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 28px 72px rgba(0,0,0,.55);
    --icon-shadow: 0 0 18px #FFC92966, 0 0 56px #FFC92933;
    --seg-shadow: 0 1px 2px rgba(0,0,0,.45);
    --logo-glow: 0 0 18px #FFC92966;
    --dot-off: #3A3935;
    --sil-gray: .08; --sil-yellow: .2;
    color-scheme: dark;
  }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s ease, color .3s ease;
}
.mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.page { position: relative; min-height: 100vh; overflow: hidden; }

/* ---------- Siluetas del fondo ---------- */
.sils { position: absolute; inset: 0; pointer-events: none; }
.sil {
  position: absolute; left: 0; top: var(--t); width: var(--size); height: var(--size);
  color: var(--text); opacity: var(--sil-gray);
  /* Cinta: entra por la derecha, cruza y sale por la izquierda; vuelve a entrar sin fin */
  animation: walk var(--d) linear infinite; animation-delay: var(--delay);
  will-change: transform; transition: color .3s ease;
}
.sil.y { color: var(--accent); opacity: var(--sil-yellow); }
.sil-in { width: 100%; height: 100%; animation: sway var(--b) ease-in-out infinite alternate; }
.sil svg { display: block; width: 100%; height: 100%; }
@keyframes walk { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
@keyframes sway { from { transform: translateY(0) rotate(-1.5deg); } to { transform: translateY(-6px) rotate(1.5deg); } }

/* ---------- Controles flotantes ---------- */
.controls { position: absolute; top: 20px; right: 20px; z-index: 2; display: flex; align-items: center; gap: 8px; }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
.seg button {
  height: 36px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 7px; cursor: pointer;
  font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500;
  background: transparent; color: var(--muted);
}
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--seg-shadow); }
.seg.theme button { display: flex; align-items: center; justify-content: center; min-width: 40px; padding: 0; }

/* ---------- Main ---------- */
main { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 104px 20px 0; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 720px; }
.app-icon {
  width: 96px; height: 96px; border-radius: 21px; background: var(--accent); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--icon-shadow);
  animation: bob 9s ease-in-out infinite alternate; transition: box-shadow .3s ease;
}
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
h1 { margin: 28px 0 0; font-size: clamp(48px, 12vw, 64px); line-height: 1; font-weight: 600; letter-spacing: -0.04em; }
.tagline { margin: 18px 0 0; font-size: 20px; line-height: 1.4; text-wrap: balance; }
.meta { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 32px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 9px;
  font-size: 14px; text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn-secondary { border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 500; }

/* ---------- Inicio rápido ---------- */
.quick { width: 100%; max-width: 720px; margin-top: 72px; }
.section-label { margin: 0 0 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--card-shadow); overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border); }
.card-head .seg { border-radius: 9px; }
.card-head .seg button { height: 34px; padding: 0 12px; border-radius: 6px; }
.copy-btn {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; min-width: 44px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.copy-btn .ok { display: none; color: var(--accent-ink); }
.copy-btn.copied .ok { display: block; }
.copy-btn.copied .ico { display: none; }
.code-wrap { position: relative; }
.code {
  overflow-x: auto; padding: 18px 20px 20px; font-size: 13px; line-height: 1.75;
  scrollbar-width: none;
}
.code::-webkit-scrollbar { display: none; }
.code-line { display: flex; gap: 18px; min-height: 1.75em; }
.ln { flex: none; width: 16px; text-align: right; color: var(--muted); user-select: none; }
.lc { white-space: pre; }
.tk-k, .tk-x { color: var(--text); }
.tk-p { color: var(--muted); }
.tk-s { color: var(--syntax-string); }
.tk-n { color: var(--syntax-number); }
.tk-f { color: var(--syntax-function); }
.tk-a { color: var(--accent-ink); }
.tk-c { color: var(--muted); font-style: italic; }
.steps { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px; font-size: 13.5px; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 8px; }
.step-n {
  width: 20px; height: 20px; flex: none; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink);
  font-size: 11px; font-weight: 600; line-height: 20px; text-align: center;
}
.steps code { font-size: 12.5px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }

/* ---------- Capturas ---------- */
.screens { width: 100%; max-width: 980px; margin-top: 88px; }
.frame { border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shot-shadow); overflow: hidden; background: var(--bg); }
.stage { position: relative; width: 100%; height: calc(560px * var(--s, 1)); }
.stage-inner { position: absolute; top: 0; left: 0; width: 980px; height: 560px; transform: scale(var(--s, 1)); transform-origin: 0 0; }
.slide {
  position: absolute; inset: 0; opacity: 0; transform: scale(1.012);
  transition: opacity 1.2s cubic-bezier(.4,0,.2,1), transform 1.6s cubic-bezier(.2,.7,.2,1);
}
.slide.on { opacity: 1; transform: none; }
.stage { touch-action: pan-y; }
.caption-row { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 18px; }
.caption { margin: 0; min-height: 21px; font-size: 14px; color: var(--muted); text-align: center; text-wrap: balance; transition: opacity .35s ease; }
.caption.fade { opacity: 0; }
.carousel-nav { display: flex; align-items: center; gap: 8px; }
.chev {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text);
  box-shadow: var(--card-shadow); cursor: pointer; transition: border-color .2s ease, transform .2s ease;
}
.chev:hover { border-color: var(--muted); }
.chev:active { transform: scale(.94); }
.dots { display: flex; }
.dot { width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; cursor: pointer; }
.dot span { position: relative; overflow: hidden; display: block; height: 6px; width: 6px; border-radius: 999px; background: var(--dot-off); transition: width .4s cubic-bezier(.4,0,.2,1); }
.dot[aria-pressed="true"] span { width: 28px; }
/* El punto activo se rellena mientras corre el tiempo de la captura; al llenarse, pasa a la siguiente */
.dot[aria-pressed="true"] span::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--accent);
  transform-origin: left center; animation: fill var(--interval, 6.5s) linear forwards;
}
.screens.paused .dot span::after { animation-play-state: paused; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- Pie ---------- */
footer {
  width: 100%; max-width: 980px; margin-top: 64px; padding: 26px 0 40px; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted);
}
.foot-brand { display: flex; align-items: center; gap: 8px; color: var(--text); }
.foot-brand span { font-size: 15px; font-weight: 600; letter-spacing: -0.04em; }
footer nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
footer nav a { color: var(--muted); text-decoration: none; padding: 10px 0; }
footer nav a:hover { color: var(--text); }

/* ---------- Captura de la app (maqueta en HTML, nítida a cualquier tamaño) ---------- */
.shot {
  width: 980px; height: 560px; padding: 10px; display: flex; gap: 10px; overflow: hidden;
  background: var(--bg); color: var(--text); font-size: 12px; line-height: 1.4; text-align: left;
}
.s-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--card-shadow); }
.s-side { position: relative; width: 172px; flex: none; display: flex; flex-direction: column; gap: 3px; padding: 12px 10px 10px; overflow: hidden; }
.s-side::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--label-blue); }
.s-brand { display: flex; align-items: center; gap: 8px; padding: 2px 4px 12px; }
.s-logo { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; box-shadow: var(--logo-glow); }
.s-brand b { font-size: 14px; font-weight: 600; letter-spacing: -0.04em; }
.s-nav { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.s-nav.on { background: var(--surface-2); color: var(--text); }
.s-nav.on svg { color: var(--accent-ink); }
.s-conn { position: relative; margin-top: auto; display: flex; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.s-conn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--label-blue); }
.s-conn i { width: 7px; height: 7px; flex: none; margin-top: 4px; border-radius: 99px; background: var(--success); }
.s-conn b { display: block; font-size: 11.5px; font-weight: 600; }
.s-conn small { display: block; font-size: 10px; color: var(--muted); }
.s-list { width: 168px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 10px; }
.s-label { padding: 2px 4px 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.s-search { display: flex; align-items: center; gap: 6px; height: 28px; margin-bottom: 6px; padding: 0 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; }
.s-item { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; }
.s-item.on { background: var(--surface-2); color: var(--text); }
.s-item.on svg { color: var(--accent-ink); }
.s-main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.s-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 10px; }
.s-title { display: flex; align-items: baseline; gap: 6px; }
.s-title .sch { color: var(--muted); font-size: 13px; }
.s-title b { font-size: 15px; font-weight: 600; }
.s-title small { font-size: 11px; color: var(--muted); }
.s-tabs { display: flex; gap: 2px; padding: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; font-size: 11.5px; font-weight: 500; }
.s-tabs span { padding: 4px 10px; color: var(--muted); }
.s-tabs span.on { border-radius: 6px; background: var(--surface); color: var(--text); box-shadow: var(--seg-shadow); }
.s-tools { display: flex; align-items: center; gap: 6px; padding: 0 14px 10px; font-size: 11.5px; font-weight: 500; }
.s-btn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; }
.s-btn.pri { border: 0; padding: 0 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.s-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 9px; border-radius: 7px; background: var(--accent-tint); color: var(--accent-ink); font-size: 11px; }
.s-grid { flex: 1; border-top: 1px solid var(--border); }
.s-row { display: grid; grid-template-columns: 32px 60px 1.1fr 1.35fr 86px 80px 1.45fr; height: 32px; align-items: center; border-bottom: 1px solid var(--border); font-size: 11.5px; }
.s-row.hd { background: var(--surface-2); font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
.s-row.sel { background: var(--row-selected); }
.s-cell { display: flex; align-items: center; gap: 4px; height: 100%; min-width: 0; padding: 0 10px; border-left: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
.s-row.hd .s-cell b { font-weight: 500; }
.s-row.hd .s-cell small { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10px; color: var(--muted); }
.s-cb { display: flex; justify-content: center; }
.s-cb i { width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid var(--muted); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
.s-cb i.on { border-color: var(--accent); background: var(--accent); }
.c-null { color: var(--muted); font-style: italic; }
.c-fk { color: var(--accent-ink); }
.c-edit { background: var(--accent-tint); }
.s-row.del .s-cell { color: var(--muted); text-decoration: line-through; }
.s-row.sel .c-null { color: var(--row-selected-muted); }
.s-row.sel .c-fk { color: var(--row-selected-ink); }
.s-row.sel .c-edit { background: var(--row-selected-edited); }
.s-pill { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 5px 5px 5px 14px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 11.5px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.s-pill i { width: 7px; height: 7px; border-radius: 99px; background: #FFC929; }
.s-pill u { text-underline-offset: 2px; opacity: .85; }
.s-pill .ghost { padding: 5px 10px; opacity: .85; }
.s-pill .save { padding: 5px 12px; border-radius: 999px; background: #FFC929; color: #17130C; font-weight: 600; }
.s-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.s-ed-head { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--border); }
.s-ed-head b { font-size: 13px; font-weight: 600; }
.s-ed-head small { font-size: 10.5px; color: var(--muted); }
.s-ed { padding: 10px 0 12px; font-size: 12px; line-height: 1.8; }
.s-ed .code-line { gap: 14px; min-height: 0; }
.s-ed .ln { width: 28px; opacity: .6; }
.s-res { flex: 1; min-height: 0; overflow: hidden; }
.s-res-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; }
.s-res-head b { font-size: 12.5px; font-weight: 600; }
.s-res-head small { font-size: 10.5px; color: var(--muted); }
.s-r3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 27px; align-items: center; border-bottom: 1px solid var(--border); font-size: 11.5px; }
.s-r3.hd { height: 28px; background: var(--surface-2); border-top: 1px solid var(--border); font-weight: 500; }
.s-r3 > span { padding: 0 14px; height: 100%; display: flex; align-items: center; gap: 5px; }
.s-r3 > span + span { border-left: 1px solid var(--border); }
.s-r3.hd small { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10px; color: var(--muted); font-weight: 400; }
.s-hist { display: flex; flex-direction: column; gap: 1px; padding: 5px 8px; }
.s-hist span { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-hist small { font-size: 10px; color: var(--muted); }

/* ---------- Móvil ---------- */
@media (max-width: 640px) {
  main { padding-top: 92px; }
  .copy-btn .label { display: none; }
  .copy-btn { padding: 0; width: 44px; }
  .code-wrap::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 28px; pointer-events: none;
    background: linear-gradient(to right, transparent, var(--surface));
  }
  .sil.hide-sm { display: none; }

    }).join('');
    var cols = [['id', 'int8', 'pk'], ['name', 'text', ''], ['email', 'text', ''], ['country', 'char(2)', ''], ['plan_id', 'int4', 'fk'], ['created_at', 'timestamptz', '']];
    var head = '<div class="s-row hd"><div class="s-cb"><i class="on"><span style="width:7px;height:1.6px;background:var(--on-accent);border-radius:1px;display:block"></span></i></div>' +
      cols.map(function (c) { return '<div class="s-cell">' + (c[2] === 'pk' ? IC.key : c[2] === 'fk' ? IC.fk : '') + '<b>' + c[0] + '</b><small>' + c[1] + '</small></div>'; }).join('') + '</div>';
    var data = [
      ['1', 'Lucía Romero', 'lucia@example.com', 'ES', '3', '2026-03-02 09:14'],
      ['2', 'Owen Hartley', 'owen@example.com', 'GB', '1', '2026-03-05 17:40'],
      ['3', 'Marta Gil', 'marta@example.com', 'ES', null, '2026-03-09 11:02'],
      ['4', 'Kenji Mori', 'kenji@example.com', 'JP', '2', '2026-03-11 08:27'],
      ['5', 'Ana Ruiz', 'ana@example.com', 'ES', '3', '2026-03-14 19:55'],
      ['6', 'Paul Weber', 'paul@example.com', 'DE', '1', '2026-03-20 13:31'],
      ['7', 'Sara Costa', 'sara@example.com', 'PT', '2', '2026-03-21 10:06'],
      ['8', 'Iván Soler', 'ivan@example.com', 'ES', '1', '2026-03-24 16:48']
    ];
    var rows = data.map(function (r, ri) {
      var sel = ri === 3, del = ri === 5;
      var cells = r.map(function (v, ci) {
        var cls = 's-cell';
        if (v === null) cls += ' c-null';
        else if (ci === 4 && !del) cls += ' c-fk';
        if (ri === 1 && ci === 1) cls += ' c-edit';
        return '<div class="' + cls + '">' + (v === null ? 'NULL' : esc(v)) + (ci === 4 && v !== null && !del ? '<span style="font-size:10px">↗</span>' : '') + '</div>';
      }).join('');
      return '<div class="s-row mono' + (sel ? ' sel' : '') + (del ? ' del' : '') + '"><div class="s-cb"><i class="' + (sel ? 'on' : '') + '">' + (sel ? IC.check : '') + '</i></div>' + cells + '</div>';
    }).join('');
    return '<div class="s-card s-list"><div class="s-label">' + esc(A.tables) + '</div><div class="s-search">' + IC.search + esc(A.search) + '</div>' + tables + '</div>' +
      '<div class="s-card s-main">' +
        '<div class="s-head"><div class="s-title"><span class="sch">public /</span><b>customers</b><small class="mono">' + esc(A.rows) + '</small></div>' +
        '<div class="s-tabs"><span class="on">' + esc(A.tabs[0]) + '</span><span>' + esc(A.tabs[1]) + '</span><span>' + esc(A.tabs[2]) + '</span></div></div>' +
        '<div class="s-tools"><span class="s-btn">' + IC.filter + esc(A.filter) + '</span><span class="s-btn">' + IC.sort + esc(A.sort) + '</span>' +
        '<span class="s-chip mono">created_at &gt; \'2026-03-01\' <span style="opacity:.8">×</span></span><span style="flex:1"></span>' +
        '<span class="s-btn">' + IC.dl + 'CSV</span><span class="s-btn pri">' + IC.plus + esc(A.insert) + '</span></div>' +
        '<div class="s-grid">' + head + rows + '</div>' +
        '<div class="s-pill"><i></i><span style="font-weight:500">' + esc(A.pending) + '</span><u>' + esc(A.diff) + '</u><span class="ghost">' + esc(A.discard) + '</span><span class="save">' + esc(A.save) + '</span></div>' +
      '</div>';
  }

  function sqlView(A) {
    var saved = A.savedNames.map(function (n, i) { return '<div class="s-item' + (i === 0 ? ' on' : '') + '" style="font-weight:500;font-size:12px">' + esc(n) + '</div>'; }).join('');
    var hist = ['select * from orders where status = …', 'update plans set price = 19 where id = 2', 'explain analyze select * from events …', 'select count(*) from customers']
      .map(function (q, i) { return '<div class="s-hist"><span class="mono">' + esc(q) + '</span><small>' + esc(A.when[i]) + '</small></div>'; }).join('');
    var sql = [
      [['c', A.sqlComment]],
      [['a', 'select '], ['f', 'date_trunc'], ['p', '('], ['s', "'month'"], ['p', ', '], ['x', 'paid_at'], ['p', ') '], ['a', 'as'], ['x', ' month'], ['p', ',']],
      [['x', '       '], ['f', 'sum'], ['p', '('], ['x', 'amount'], ['p', ') '], ['a', 'as'], ['x', ' revenue'], ['p', ',']],
      [['x', '       '], ['f', 'count'], ['p', '(*) '], ['a', 'as'], ['x', ' invoices']],
      [['a', 'from'], ['x', ' invoices']],
      [['a', 'where'], ['x', ' paid_at '], ['p', '> '], ['f', 'now'], ['p', '() - '], ['a', 'interval '], ['s', "'6 months'"]],
      [['a', 'group by '], ['n', '1']],
      [['a', 'order by '], ['n', '1'], ['a', ' desc'], ['p', ';']]
    ];
    var res = [['2026-09-01', '48210.00', '312'], ['2026-08-01', '45980.50', '298'], ['2026-07-01', '44102.25', '291'], ['2026-06-01', '41876.00', '277'], ['2026-05-01', '39450.75', '260'], ['2026-04-01', '37020.00', '248']]
      .map(function (r) { return '<div class="s-r3 mono"><span>' + r[0] + '</span><span>' + r[1] + '</span><span>' + r[2] + '</span></div>'; }).join('');
    return '<div class="s-card s-list"><div style="padding:2px 4px 8px;font-size:13px;font-weight:600">' + esc(A.queries) + '</div><div class="s-label" style="padding-top:4px">' + esc(A.saved) + '</div>' + saved +
      '<div class="s-label" style="padding-top:14px">' + esc(A.history) + '</div>' + hist + '</div>' +
      '<div class="s-col"><div class="s-card" style="overflow:hidden"><div class="s-ed-head"><b>' + esc(A.queryTitle) + '</b><small class="mono">timeout 30s</small><span style="flex:1"></span>' +
      '<span class="s-btn" style="font-size:11.5px;font-weight:500">' + esc(A.save) + '</span><span class="s-btn pri" style="font-size:11.5px">' + IC.play + esc(A.run) + '<span class="mono" style="font-size:10.5px;opacity:.7">⌘↵</span></span></div>' +
      '<div class="s-ed mono">' + renderLines(sql) + '</div></div>' +
      '<div class="s-card s-res"><div class="s-res-head"><b>' + esc(A.results) + '</b><small class="mono">' + esc(A.resMeta) + '</small></div>' +
      '<div class="s-r3 hd"><span>month <small>timestamptz</small></span><span>revenue <small>numeric</small></span><span>invoices <small>int8</small></span></div>' + res + '</div></div>';
  }

  function shot(view, lang, themeClass) {
    var A = I18N[lang].app;
    return '<div class="shot ' + (themeClass || '') + '" role="img" aria-label="' + esc(A.aria) + '">' + sidebar(A, view) + (view === 'sql' ? sqlView(A) : tablesView(A)) + '</div>';
  }

  function renderShots() {
    var other = state.lang === 'es' ? 'en' : 'es';
    var slides = document.querySelectorAll('.slide');
    slides[0].innerHTML = shot('tables', state.lang, '');
    slides[1].innerHTML = shot('sql', state.lang, '');
    slides[2].innerHTML = shot('tables', other, isDark() ? 't-light' : 't-dark');
  }

  /* ---------- Carrusel ---------- */
  var caption = document.getElementById('caption');
  function renderSlide(animateCaption) {
    var L = I18N[state.lang];
    document.querySelectorAll('.slide').forEach(function (s, i) {
      s.classList.toggle('on', i === state.slide);
      s.setAttribute('aria-hidden', String(i !== state.slide));
    });
    if (animateCaption && !reduceMQ.matches) {
      caption.classList.add('fade');
      setTimeout(function () { caption.textContent = L.captions[state.slide]; caption.classList.remove('fade'); }, 350);
    } else {
      caption.textContent = L.captions[state.slide];
    }
    /* Se recrean los puntos para que la barra de progreso empiece de cero */
    document.getElementById('dots').innerHTML = L.dots.map(function (d, i) {
      return '<button type="button" class="dot" data-i="' + i + '" aria-label="' + esc(d) + '" aria-pressed="' + (i === state.slide) + '"><span></span></button>';
    }).join('');
    document.getElementById('prev').setAttribute('aria-label', L.prev);
    document.getElementById('next').setAttribute('aria-label', L.next);
  }
  function go(i) { state.slide = (i + 3) % 3; renderSlide(true); }
  document.getElementById('dots').addEventListener('click', function (e) {
    var b = e.target.closest('.dot'); if (b) go(Number(b.dataset.i));
  });
  document.getElementById('prev').addEventListener('click', function () { go(state.slide - 1); });
  document.getElementById('next').addEventListener('click', function () { go(state.slide + 1); });
  /* Avance automático: cuando el punto activo termina de rellenarse (sin avance con reducir movimiento) */
  document.getElementById('dots').addEventListener('animationend', function (e) {
    if (e.animationName === 'fill' && !reduceMQ.matches) go(state.slide + 1);
  });
  var screens = document.getElementById('screens');
  function setPaused() { screens.classList.toggle('paused', state.hover || state.focus || document.hidden); }
  screens.addEventListener('mouseenter', function () { state.hover = true; setPaused(); });
  screens.addEventListener('mouseleave', function () { state.hover = false; setPaused(); });
  screens.addEventListener('focusin', function () { state.focus = true; setPaused(); });
  screens.addEventListener('focusout', function (e) { if (!screens.contains(e.relatedTarget)) { state.focus = false; setPaused(); } });
  document.addEventListener('visibilitychange', setPaused);
  screens.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.slide - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(state.slide + 1); }
  });
  /* Deslizar con el dedo */
  var startX = null;
  var stageEl = document.getElementById('stage');
  stageEl.addEventListener('pointerdown', function (e) { startX = e.clientX; });
  stageEl.addEventListener('pointerup', function (e) {
    if (startX === null) return;
    var dx = e.clientX - startX; startX = null;
    if (Math.abs(dx) > 40) go(state.slide + (dx < 0 ? 1 : -1));
  });
  stageEl.addEventListener('pointercancel', function () { startX = null; });

  /* Escala de la captura al ancho disponible */
  var stage = document.getElementById('stage');
  function fit() { stage.style.setProperty('--s', Math.min(1, stage.clientWidth / 980)); }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else window.addEventListener('resize', fit);
  fit();

  /* ---------- Idioma ---------- */
  function renderLang() {
    var L = I18N[state.lang];
    root.lang = state.lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = L[el.dataset.i18n]; });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)); });
    var cb = document.getElementById('copy-btn');
    cb.querySelector('.label').textContent = cb.classList.contains('copied') ? L.copied : L.copy;
    cb.setAttribute('aria-label', L.copy);
    renderCode(); renderShots(); renderSlide(); renderTheme();
  }
  document.getElementById('lang-group').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]'); if (!b) return;
    state.lang = b.dataset.lang; renderLang();
  });

  /* ---------- Tema ---------- */
  function themePref() { return root.getAttribute('data-theme') || 'system'; }
  function renderTheme() {
    var dark = isDark(), L = I18N[state.lang], pref = themePref();
    var g = document.getElementById('theme-group');
    g.setAttribute('aria-label', L.theme);
    g.querySelectorAll('[data-theme-opt]').forEach(function (b) {
      var o = b.dataset.themeOpt;
      b.setAttribute('aria-pressed', String(o === pref));
      b.setAttribute('aria-label', L.themeOpts[o]); b.title = L.themeOpts[o];
    });
    var third = document.querySelector('.slide[data-slide="2"] .shot');
    if (third) { third.classList.toggle('t-light', dark); third.classList.toggle('t-dark', !dark); }
  }
  document.getElementById('theme-group').addEventListener('click', function (e) {
    var b = e.target.closest('[data-theme-opt]'); if (!b) return;
    var o = b.dataset.themeOpt;
    try {
      if (o === 'system') { root.removeAttribute('data-theme'); localStorage.removeItem('gb-theme'); }
      else { root.setAttribute('data-theme', o); localStorage.setItem('gb-theme', o); }
    } catch (err) {}
    renderTheme();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderTheme);

  /* ---------- Pestañas y copiar ---------- */
  document.querySelector('.card-head .seg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    state.tab = b.dataset.tab; renderCode();
  });
  document.getElementById('copy-btn').addEventListener('click', function () {
    var cb = this, L = I18N[state.lang];
    var txt = codeLines().map(function (l) { return l.map(function (t) { return t[1]; }).join(''); }).join('\n') + '\n';
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {});
    cb.classList.add('copied'); cb.querySelector('.label').textContent = L.copied;
    clearTimeout(cb._t);
    cb._t = setTimeout(function () { cb.classList.remove('copied'); cb.querySelector('.label').textContent = L.copy; }, 1600);
  });

  renderLang();
})();
</script>
</body>
</html>
