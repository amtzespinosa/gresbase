# Gresbase demo: PostgreSQL with sample data and five Gresbase instances, one per way of using it.
# Generated by scripts/demo-compose.sh from deploy/seed/ (edit those, then run `task gen`).
#
#   curl -fsSLO https://raw.githubusercontent.com/amtzespinosa/gresbase/main/deploy/docker-compose.demo.yml
#   docker compose -f docker-compose.demo.yml up -d
#   docker compose -f docker-compose.demo.yml down -v     # stop and remove everything
#
#   http://localhost:8080  no login (only answers to localhost)
#   http://localhost:8081  login demo / demo
#   http://localhost:8082  read-only
#   http://localhost:8083  setup wizard; the token: docker compose -f docker-compose.demo.yml exec gresbase-setup /gresbase setup-token
#                          the database server is "db" (user and password gresbase, database app)
#   http://localhost:8084  free mode: server db, user and password gresbase, database app
name: gresbase-demo

x-gresbase: &gresbase
  image: ghcr.io/amtzespinosa/gresbase:0.4.1
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gresbase
      POSTGRES_PASSWORD: gresbase
      POSTGRES_DB: app
    configs:
      - source: 01_schema
        target: /docker-entrypoint-initdb.d/01_schema.sql
      - source: 02_data
        target: /docker-entrypoint-initdb.d/02_data.sql
      - source: 03_wide_and_foreign
        target: /docker-entrypoint-initdb.d/03_wide_and_foreign.sql
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP so it only reports healthy once the init scripts have finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gresbase -d app"]
      interval: 2s
      timeout: 3s
      retries: 60

  gresbase:
    <<: *gresbase
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: postgres://gresbase:gresbase@db:5432/app?sslmode=disable
    volumes: [demo-data:/data]

  gresbase-login:
    <<: *gresbase
    ports: ["127.0.0.1:8081:8080"]
    environment:
      DATABASE_URL: postgres://gresbase:gresbase@db:5432/app?sslmode=disable
      GRESBASE_USER: demo
      GRESBASE_PASSWORD: demo
    volumes: [demo-data-login:/data]

  gresbase-ro:
    <<: *gresbase
    ports: ["127.0.0.1:8082:8080"]
    environment:
      DATABASE_URL: postgres://gresbase:gresbase@db:5432/app?sslmode=disable
      GRESBASE_READ_ONLY: "true"
    volumes: [demo-data-ro:/data]

  gresbase-setup:
    <<: *gresbase
    ports: ["127.0.0.1:8083:8080"]
    volumes: [demo-data-setup:/data]

  gresbase-free:
    <<: *gresbase
    ports: ["127.0.0.1:8084:8080"]
    environment:
      GRESBASE_MODE_FREE: "true"
      GRESBASE_ALLOWED_DB_HOSTS: db
    volumes: [demo-data-free:/data]

volumes:
  demo-pgdata:
  demo-data:
  demo-data-login:
  demo-data-ro:
  demo-data-setup:
  demo-data-free:

# deploy/seed/*.sql, with "$" doubled because Compose interpolates it.
configs:
  01_schema:
    content: |
      -- Demo schema for development and integration tests.
      -- Covers every case the MVP needs: varied types, identity, enum, arrays, bytea, cascades, SET NULL,
      -- a table without primary key, odd identifiers, a view, a materialized view, a partitioned table,
      -- a user trigger and an extra schema. Compatible with PostgreSQL 12–19.

      -- gen_random_uuid() is core since 13; on 12 it comes from pgcrypto (in the official image's contrib).
      DO $$$$
      BEGIN
        IF current_setting('server_version_num')::int < 130000 THEN
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
        END IF;
      END
      $$$$;

      CREATE TYPE plan_t AS ENUM ('free', 'pro', 'team');

      CREATE TABLE orgs (
        id         int8 GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name       text NOT NULL UNIQUE,
        plan       plan_t NOT NULL DEFAULT 'free',
        created_at timestamptz NOT NULL DEFAULT now()
      );
      COMMENT ON TABLE orgs IS 'Customer organizations';

      CREATE TABLE users (
        id         int8 GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        org_id     int8 REFERENCES orgs (id),
        uuid       uuid NOT NULL DEFAULT gen_random_uuid() UNIQUE,
        email      text NOT NULL UNIQUE,
        full_name  text,
        is_active  boolean NOT NULL DEFAULT true,
        plan       plan_t NOT NULL DEFAULT 'free',
        balance    numeric(12, 2) NOT NULL DEFAULT 0,
        birth_date date,
        tags       text[] NOT NULL DEFAULT '{}',
        settings   jsonb NOT NULL DEFAULT '{}',
        last_ip    inet,
        avatar     bytea,
        bio        text,
        created_at timestamptz NOT NULL DEFAULT now()
      );
      COMMENT ON TABLE users IS 'Application users';
      COMMENT ON COLUMN users.bio IS 'Free text; one row holds more than 20 KB';
      CREATE INDEX users_org_id_idx ON users (org_id);
      CREATE INDEX users_created_at_idx ON users (created_at DESC);

      CREATE TABLE projects (
        id         int8 GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        org_id     int8 NOT NULL REFERENCES orgs (id) ON DELETE CASCADE,
        owner_id   int8 REFERENCES users (id),
        name       text NOT NULL,
        budget     numeric(12, 2),
        estimate   interval,
        starts_on  date,
        updated_at timestamptz NOT NULL DEFAULT now(),
        UNIQUE (org_id, name)
      );

      CREATE FUNCTION touch_updated_at() RETURNS trigger
      LANGUAGE plpgsql AS $$$$
      BEGIN
        NEW.updated_at := now();
        RETURN NEW;
      END
      $$$$;

      CREATE TRIGGER projects_touch_updated_at
        BEFORE UPDATE ON projects
        FOR EACH ROW EXECUTE FUNCTION touch_updated_at();

      CREATE TABLE invoices (
        id        int8 GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        org_id    int8 NOT NULL REFERENCES orgs (id),
        number    text NOT NULL UNIQUE,
        issued_on date NOT NULL,
        total     numeric(12, 2) NOT NULL DEFAULT 0,
        paid      boolean NOT NULL DEFAULT false,
        metadata  jsonb
      );

      CREATE TABLE invoice_items (
        id          int8 GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        invoice_id  int8 NOT NULL REFERENCES invoices (id) ON DELETE CASCADE,
        description text NOT NULL,
        quantity    int4 NOT NULL CHECK (quantity > 0),
        unit_price  numeric(12, 2) NOT NULL,
        amount      numeric(14, 2) GENERATED ALWAYS AS (quantity * unit_price) STORED
      );
      CREATE INDEX invoice_items_invoice_id_idx ON invoice_items (invoice_id);

      CREATE TABLE sessions (
        id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id    int8 REFERENCES users (id) ON DELETE SET NULL,
        ip         inet,
        user_agent text,
        duration   interval,
        created_at timestamptz NOT NULL DEFAULT now(),
        expires_at timestamptz
      );
      CREATE INDEX sessions_user_id_idx ON sessions (user_id);

      -- No primary key on purpose: the grid shows it read-only.
      CREATE TABLE audit_log (
        at      timestamptz NOT NULL DEFAULT now(),
        actor   text,
        action  text NOT NULL,
        payload jsonb
      );

      CREATE TABLE "Weird Table" (
        id                   int4 PRIMARY KEY,
        "Column With Spaces" text,
        "select"             text
      );

      CREATE TABLE "MixedCase" (
        "Id"          int4 PRIMARY KEY,
        "DisplayName" text NOT NULL
      );

      CREATE VIEW active_users AS
        SELECT id, email, full_name, plan FROM users WHERE is_active;

      CREATE MATERIALIZED VIEW org_stats AS
        SELECT o.id, o.name, count(u.id) AS users
        FROM orgs o LEFT JOIN users u ON u.org_id = o.id
        GROUP BY o.id, o.name;

      CREATE TABLE events (
        id          bigserial,
        occurred_at timestamptz NOT NULL,
        kind        text NOT NULL,
        payload     jsonb,
        PRIMARY KEY (id, occurred_at)
      ) PARTITION BY RANGE (occurred_at);
      CREATE TABLE events_2025 PARTITION OF events FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
      CREATE TABLE events_2026 PARTITION OF events FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');

      CREATE SCHEMA billing;

      CREATE TABLE billing.plans (
        code          plan_t PRIMARY KEY,
        monthly_price numeric(12, 2) NOT NULL,
        features      text[] NOT NULL DEFAULT '{}'
      );

      CREATE TABLE billing.payments (
        id         int8 GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        invoice_id int8 NOT NULL REFERENCES public.invoices (id),
        amount     numeric(12, 2) NOT NULL,
        paid_at    timestamptz NOT NULL DEFAULT now()
      );
  02_data:
    content: |
      -- Deterministic demo data (no random()) so tests can rely on exact values.

      INSERT INTO orgs (name, plan, created_at)
      SELECT 'Org ' || g,
             (ARRAY['free', 'pro', 'team']::plan_t[])[1 + g % 3],
             timestamptz '2023-01-01 00:00+00' + g * interval '9 days'
      FROM generate_series(1, 20) g;

      -- ~12,000 users with plenty of duplicated values in sortable columns (plan, is_active, org_id).
      INSERT INTO users (org_id, email, full_name, is_active, plan, balance, birth_date, tags, settings,
                         last_ip, avatar, bio, created_at)
      SELECT CASE WHEN g % 100 = 0 THEN NULL ELSE 1 + g % 20 END,
             'user' || g || '@example.com',
             'User ' || g,
             g % 7 <> 0,
             (ARRAY['free', 'pro', 'team']::plan_t[])[1 + g % 3],
             round((g * 37 % 100000) / 100.0, 2),
             date '1960-01-01' + (g * 13 % 15000),
             CASE g % 4 WHEN 0 THEN '{}'::text[] WHEN 1 THEN ARRAY['beta'] WHEN 2 THEN ARRAY['beta', 'vip']
                        ELSE ARRAY['admin', 'with,comma', 'with "quotes"'] END,
             jsonb_build_object('theme', CASE WHEN g % 2 = 0 THEN 'dark' ELSE 'light' END,
                                'notifications', g % 3 = 0, 'score', g % 10),
             ('10.' || (g / 65536) % 256 || '.' || (g / 256) % 256 || '.' || g % 256)::inet,
             CASE WHEN g % 50 = 0 THEN decode(md5(g::text), 'hex') END,
             CASE WHEN g % 5 = 0 THEN NULL ELSE 'Bio of user ' || g END,
             timestamptz '2024-01-01 00:00+00' + g * interval '37 minutes'
      FROM generate_series(1, 12000) g;

      -- Long text (> 20 KB) to exercise truncation in the grid.
      UPDATE users SET bio = repeat('Lorem ipsum dolor sit amet, consectetur adipiscing elit. ', 400) WHERE id = 1;

      -- An id above 2^53 to check that int8 keeps its precision end to end.
      INSERT INTO users (id, org_id, email, full_name, plan, balance, settings)
      VALUES (9007199254740993, 1, 'big-id@example.com', 'Big Id', 'team', 9999999999.99,
              '{"nested": {"array": [1, 2, 3], "null": null}}');

      INSERT INTO projects (org_id, owner_id, name, budget, estimate, starts_on)
      SELECT 1 + g % 20, 1 + g * 7 % 12000, 'Project ' || g,
             CASE WHEN g % 4 = 0 THEN NULL ELSE (g * 1250.5)::numeric(12, 2) END,
             make_interval(days => g % 90, hours => g % 24),
             date '2025-01-01' + g % 365
      FROM generate_series(1, 200) g;

      INSERT INTO invoices (org_id, number, issued_on, paid, metadata)
      SELECT 1 + g % 20, 'INV-' || lpad(g::text, 5, '0'), date '2025-01-01' + g % 400, g % 3 = 0,
             CASE WHEN g % 2 = 0 THEN jsonb_build_object('po', 'PO-' || g, 'notes', 'Net 30') END
      FROM generate_series(1, 500) g;

      INSERT INTO invoice_items (invoice_id, description, quantity, unit_price)
      SELECT 1 + g % 500, 'Item ' || g, 1 + g % 9, (5 + g % 200)::numeric(12, 2)
      FROM generate_series(1, 1500) g;

      UPDATE invoices i SET total = s.sum
      FROM (SELECT invoice_id, sum(amount) AS sum FROM invoice_items GROUP BY invoice_id) s
      WHERE s.invoice_id = i.id;

      INSERT INTO sessions (id, user_id, ip, user_agent, duration, created_at, expires_at)
      SELECT md5('session' || g)::uuid, 1 + g * 13 % 12000, ('192.168.' || g / 256 % 256 || '.' || g % 256)::inet,
             CASE g % 3 WHEN 0 THEN 'Mozilla/5.0' WHEN 1 THEN 'curl/8.0' ELSE NULL END,
             make_interval(mins => g % 600),
             timestamptz '2025-06-01 00:00+00' + g * interval '1 hour',
             timestamptz '2025-06-01 00:00+00' + g * interval '1 hour' + interval '12 hours'
      FROM generate_series(1, 2000) g;

      INSERT INTO audit_log (at, actor, action, payload)
      SELECT timestamptz '2025-01-01 00:00+00' + g * interval '3 hours',
             CASE WHEN g % 10 = 0 THEN NULL ELSE 'user' || g % 50 || '@example.com' END,
             (ARRAY['login', 'logout', 'update', 'delete'])[1 + g % 4],
             jsonb_build_object('seq', g)
      FROM generate_series(1, 300) g;

      INSERT INTO "Weird Table" (id, "Column With Spaces", "select") VALUES
        (1, 'spaces are fine', 'reserved word'),
        (2, 'quote '' inside', 'semi;colon'),
        (3, NULL, '%_wildcards_%');

      INSERT INTO "MixedCase" ("Id", "DisplayName") VALUES (1, 'Alpha'), (2, 'Beta'), (3, 'Gamma');

      INSERT INTO events (occurred_at, kind, payload)
      SELECT timestamptz '2025-01-01 00:00+00' + g * interval '7 hours',
             (ARRAY['click', 'view', 'signup'])[1 + g % 3],
             jsonb_build_object('n', g)
      FROM generate_series(1, 2000) g;

      INSERT INTO billing.plans (code, monthly_price, features) VALUES
        ('free', 0, ARRAY['1 project']),
        ('pro', 25, ARRAY['10 projects', 'email support']),
        ('team', 99, ARRAY['unlimited projects', 'sso', 'priority support']);

      INSERT INTO billing.payments (invoice_id, amount, paid_at)
      SELECT id, total, issued_on + interval '10 days' FROM invoices WHERE paid;

      REFRESH MATERIALIZED VIEW org_stats;
      ANALYZE;
  03_wide_and_foreign:
    content: |
      -- A wide table (32 columns, 1,000 rows) to measure the grid with many columns, and a foreign table
      -- (postgres_fdw) that reads orgs from this same database. Deterministic, like the rest of the seed.

      CREATE TABLE wide_metrics (
        id          int8 GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        label       text NOT NULL,
        category    text NOT NULL,
        plan        plan_t NOT NULL,
        is_enabled  boolean NOT NULL,
        is_flagged  boolean,
        score       int4 NOT NULL,
        rank        int2 NOT NULL,
        hits        int8 NOT NULL,
        ratio       float8 NOT NULL,
        weight      float4,
        amount      numeric(14, 2) NOT NULL,
        fee         numeric(10, 4),
        day         date NOT NULL,
        at_time     time NOT NULL,
        measured_at timestamptz NOT NULL,
        updated_at  timestamp,
        window_len  interval,
        ref         uuid NOT NULL,
        host_ip     inet,
        tags        text[] NOT NULL,
        scores      int4[],
        attrs       jsonb NOT NULL,
        raw         json,
        checksum    bytea,
        note        text,
        code        varchar(12) NOT NULL,
        grade       char(1) NOT NULL,
        temp_c      numeric(5, 1),
        lat         float8,
        lon         float8,
        status      text NOT NULL
      );
      COMMENT ON TABLE wide_metrics IS '32 columns of mixed types for grid performance checks';

      INSERT INTO wide_metrics (label, category, plan, is_enabled, is_flagged, score, rank, hits, ratio,
                                weight, amount, fee, day, at_time, measured_at, updated_at, window_len, ref,
                                host_ip, tags, scores, attrs, raw, checksum, note, code, grade, temp_c,
                                lat, lon, status)
      SELECT 'Metric ' || g,
             (ARRAY['cpu', 'memory', 'disk', 'network', 'latency'])[1 + g % 5],
             (ARRAY['free', 'pro', 'team']::plan_t[])[1 + g % 3],
             g % 4 <> 0,
             CASE WHEN g % 9 = 0 THEN NULL ELSE g % 2 = 0 END,
             g * 7 % 1000,
             g % 100,
             g::int8 * 104729,
             round((g % 97) / 97.0, 6),
             CASE WHEN g % 11 = 0 THEN NULL ELSE (g % 50) / 10.0 END,
             round((g * 31 % 1000000) / 100.0, 2),
             CASE WHEN g % 6 = 0 THEN NULL ELSE round((g % 1000) / 1000.0, 4) END,
             date '2025-01-01' + g % 365,
             time '00:00' + (g * 97 % 86400) * interval '1 second',
             timestamptz '2025-01-01 00:00+00' + g * interval '17 minutes',
             CASE WHEN g % 8 = 0 THEN NULL ELSE timestamp '2025-06-01 00:00' + g * interval '1 hour' END,
             CASE WHEN g % 7 = 0 THEN NULL ELSE (g % 120) * interval '1 minute' END,
             md5('wide' || g)::uuid,
             ('192.168.' || g / 256 % 256 || '.' || g % 256)::inet,
             CASE g % 3 WHEN 0 THEN '{}'::text[] WHEN 1 THEN ARRAY['alpha'] ELSE ARRAY['alpha', 'beta'] END,
             ARRAY[g % 10, g % 20, g % 30],
             jsonb_build_object('region', (ARRAY['eu', 'us', 'ap'])[1 + g % 3], 'shard', g % 16),
             json_build_object('v', g),
             CASE WHEN g % 25 = 0 THEN decode(md5(g::text), 'hex') END,
             CASE WHEN g % 4 = 0 THEN NULL ELSE 'Note for metric ' || g END,
             'C-' || lpad(g::text, 6, '0'),
             chr(65 + g % 5),
             CASE WHEN g % 13 = 0 THEN NULL ELSE round(((g % 600) - 100) / 10.0, 1) END,
             40 + (g % 1000) / 1000.0,
             -3 - (g % 1000) / 1000.0,
             (ARRAY['ok', 'warn', 'critical'])[1 + g % 3]
      FROM generate_series(1, 1000) g;

      -- Foreign table over orgs in this same database. Without a host, postgres_fdw connects through the
      -- Unix socket (trust in the official image) as the superuser that runs the seed, so no password is
      -- stored. The database name is fixed at seed time, so copies of this database still read from it.
      CREATE EXTENSION postgres_fdw;
      DO $$$$
      BEGIN
        EXECUTE format('CREATE SERVER self_fdw FOREIGN DATA WRAPPER postgres_fdw OPTIONS (dbname %L)',
                       current_database());
        EXECUTE format('CREATE USER MAPPING FOR %I SERVER self_fdw OPTIONS (user %L)',
                       current_user, current_user);
      END
      $$$$;

      CREATE FOREIGN TABLE remote_orgs (
        id         int8,
        name       text,
        plan       plan_t,
        created_at timestamptz
      ) SERVER self_fdw OPTIONS (schema_name 'public', table_name 'orgs');
      COMMENT ON FOREIGN TABLE remote_orgs IS 'orgs read through postgres_fdw';
